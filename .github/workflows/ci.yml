name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # SQLite is the development default, PostgreSQL is what runs in Docker and
    # the only database with full-text search. Test on both.
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookshop
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: bookshop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookshop"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: ${{ matrix.database == 'postgres' && 'bookshop' || '' }}
      POSTGRES_USER: bookshop
      POSTGRES_PASSWORD: bookshop
      POSTGRES_HOST: 127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gettext
          pip install -r requirements.txt ruff coverage

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Check translations are compiled
        run: |
          python manage.py compilemessages --ignore=.venv
          git diff --exit-code -- locale/

      - name: Run tests with coverage
        run: |
          coverage run manage.py test --noinput
          coverage report --fail-under=90

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run type-check

      - name: Run tests with coverage
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

  # Builds the production images, starts the whole stack with docker compose
  # and walks through a purchase in a real browser.
  e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    env:
      UPDATE_RATES_ON_START: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        working-directory: frontend
        run: BASE_URL=http://localhost:8080 pnpm run smoke

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
