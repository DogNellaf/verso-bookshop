name: Release

# Pushing a tag such as v1.0.0 publishes a GitHub release with the notes of
# that version from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^(## )?\[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Verso $GITHUB_REF_NAME" --notes-file notes.md
